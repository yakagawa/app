<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find the Card</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fb;color:#111;display:flex;justify-content:center;align-items:flex-start;padding:20px}.app{width:min(1100px,100%);background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.13);padding:18px}h1{margin:0 0 8px;text-align:center;font-size:26px}.description{margin:0 auto 14px;max-width:760px;line-height:1.7;color:#444;font-size:14px}.screen{width:100%;min-height:240px;border:2px solid #222;border-radius:14px;background:white;padding:16px;overflow-x:auto}.choose{width:min(420px,100%);margin:0 auto;min-height:170px;padding-top:36px}.choose-row{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:18px;margin:0 auto 20px}.num-cards{text-align:center;font-size:44px;font-weight:800}button{border:3px solid #111;border-radius:10px;background:#fff;color:#111;cursor:pointer;transition:.12s;user-select:none}button:hover:not(:disabled){background:#eee;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}.arrow{width:54px;height:54px;font-size:34px;font-weight:800;display:grid;place-items:center;padding:0}.start{display:block;width:130px;height:44px;margin:0 auto;font-size:24px;font-weight:700}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:16px;min-width:max-content}.find{font-size:24px;font-weight:800;justify-self:start}.clicks{font-size:24px;font-weight:800;justify-self:center}.retry{justify-self:end;width:100px;height:40px;font-size:20px;font-weight:700;border-width:3px}.cards{display:flex;gap:20px;align-items:center;min-width:max-content;padding:0 4px 12px}.card{width:100px;height:150px;border:3px solid #111;border-radius:8px;display:grid;place-items:center;font-size:48px;font-weight:800;cursor:pointer;user-select:none;transition:.12s;background:#b4b4b4;color:transparent}.card:hover:not(.revealed):not(.disabled){background:#c8c8c8;transform:translateY(-3px)}.card.revealed{background:#fff;color:#111;cursor:default}.card.disabled{cursor:default}.message{margin-top:4px;min-height:48px;text-align:center;color:#c80000;font-size:30px;font-weight:800}.rule{margin-top:12px;padding:10px 12px;background:#f7f8fb;border-radius:10px;color:#555;font-size:13px;line-height:1.7}@media(max-width:640px){.topbar{grid-template-columns:1fr;justify-items:center}.find,.clicks,.retry{justify-self:center}.card{width:84px;height:126px;font-size:40px}.cards{gap:14px}}
  </style>
</head>
<body>
  <main class="app">
    <h1>Find the Card</h1>
    <p class="description">7〜15枚のカードを選び、指定されたターゲットを探します。5回以内にターゲットを見つけるゲームです。</p>
    <section id="screen" class="screen"></section>
    <p class="rule">ルール：カードには異なる数字が入っています。ターゲットの数字は必ずどこかのカードに含まれます。5回以内に見つければ成功です。</p>
  </main>
  <script>
    const screen=document.getElementById('screen');
    const MIN_CARDS=7,MAX_CARDS=15,MAX_CLICKS=5;
    let gameState='choose',numCards=MIN_CARDS,cards=[],revealed=[],clickCount=0,gameOver=false,message='',targetNumber=null;
    function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
    function sampleDistinctNumbers(count,exceptValue){const pool=[];for(let i=1;i<=100;i++){if(i!==exceptValue)pool.push(i)}for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,count)}
    function generateCards(n,target){const values=sampleDistinctNumbers(n-1,target);values.push(target);values.sort((a,b)=>a-b);return values}
    function prepareGame(){targetNumber=randInt(1,100);cards=generateCards(numCards,targetNumber);revealed=Array(numCards).fill(false);clickCount=0;gameOver=false;message='';gameState='play';render()}
    function returnToChoose(){gameState='choose';render()}
    function changeNumCards(delta){numCards=Math.max(MIN_CARDS,Math.min(MAX_CARDS,numCards+delta));render()}
    function clickCard(index){if(gameOver||revealed[index])return;revealed[index]=true;clickCount++;if(cards[index]===targetNumber){message=`Correct! You found ${targetNumber}!`;gameOver=true}else if(clickCount===MAX_CLICKS){const pos=cards.indexOf(targetNumber)+1;message=`Game Over! ${targetNumber} was at position ${pos}.`;gameOver=true}render()}
    function renderChoose(){screen.innerHTML='';const choose=document.createElement('div');choose.className='choose';const row=document.createElement('div');row.className='choose-row';const left=document.createElement('button');left.className='arrow';left.textContent='<';left.disabled=numCards<=MIN_CARDS;left.onclick=()=>changeNumCards(-1);const num=document.createElement('div');num.className='num-cards';num.textContent=numCards;const right=document.createElement('button');right.className='arrow';right.textContent='>';right.disabled=numCards>=MAX_CARDS;right.onclick=()=>changeNumCards(1);row.append(left,num,right);const start=document.createElement('button');start.className='start';start.textContent='Start';start.onclick=prepareGame;choose.append(row,start);screen.appendChild(choose)}
    function renderPlay(){screen.innerHTML='';const topbar=document.createElement('div');topbar.className='topbar';const find=document.createElement('div');find.className='find';find.textContent=`Find: ${targetNumber}`;const clicksLeft=document.createElement('div');clicksLeft.className='clicks';clicksLeft.textContent=`Clicks left: ${Math.max(0,MAX_CLICKS-clickCount)}`;const retry=document.createElement('button');retry.className='retry';retry.textContent='Retry';retry.style.visibility=gameOver?'visible':'hidden';retry.onclick=returnToChoose;topbar.append(find,clicksLeft,retry);const cardsArea=document.createElement('div');cardsArea.className='cards';cards.forEach((value,index)=>{const card=document.createElement('div');card.className='card';card.textContent=value;if(revealed[index])card.classList.add('revealed');if(gameOver)card.classList.add('disabled');card.onclick=()=>clickCard(index);cardsArea.appendChild(card)});const msg=document.createElement('div');msg.className='message';msg.textContent=gameOver?message:'';screen.append(topbar,cardsArea,msg)}
    function render(){gameState==='choose'?renderChoose():renderPlay()} render();
  </script>
</body>
</html>
